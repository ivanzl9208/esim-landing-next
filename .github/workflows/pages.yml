name: Publish current landing

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit from ivanzl9208/esim-landing
        required: true
        default: codex/improvements
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out landing source
        uses: actions/checkout@v4
        with:
          repository: ivanzl9208/esim-landing
          ref: ${{ inputs.source_ref || 'codex/improvements' }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Record published source
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {execFileSync} from 'node:child_process'; const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); writeFileSync('dist/deployment.json',JSON.stringify({repository:'ivanzl9208/esim-landing',sourceCommit:commit})+'\n');"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
